name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint and regression tests
        run: npm run check

      - name: Build portable HTML
        run: npm run build

      - name: Validate and build GitHub Pages profile
        run: npm run build:pages

      - name: Check dependency advisories
        run: npm run audit
